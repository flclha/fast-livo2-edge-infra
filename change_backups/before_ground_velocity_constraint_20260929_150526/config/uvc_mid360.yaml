# 参考avia中的配置
common:
  img_topic: "/uvc_camera/image_sync"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [-0.011, -0.02329, 0.04412]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  Rcl: [ -0.012018, -0.999927, -0.000851,
          0.367624, -0.003626, -0.929967,
          0.929897, -0.011489,  0.367641]
  Pcl: [ 0.024808, -0.106047, -0.046701]  # FAST-Calib joint_attempt04 2026-08-25, reprojection RMSE 1.432 px

time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0  # Keep zero until the V4L2 timestamp-to-exposure delay is measured

preprocess:
  point_filter_num: 1
  # 参与位资估计的点云分辨率，值越大保留点越少，计算负担越小， 2表示保留50%点
  filter_size_surf: 0.05 # 建图精细程度
  lidar_type: 1 # Livox MID360 (使用AVIA类型)
  scan_line: 4 # 扫描线数
  blind: 1.0 # 盲区距离，忽略掉传感器中心小于此直的点

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5  # restored Version5 original value after motion A/B comparison
  gyr_cov: 0.3  # restored Version5 original value
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 4
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0015
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]
  # 仅降低归一化残差尾部的测量信息，不过滤最终位姿，也不丢弃整帧。
  robust_weight_en: true
  robust_huber_delta: 1.5
  robust_min_weight: 0.15
  # 输出 LiDAR 更新前预测、更新后状态以及二者的 innovation。
  innovation_diag_en: true
  innovation_warn_threshold: 0.010
  innovation_csv_path: /home/nuc/versions/version5/logs/lio_innovation.csv

local_map:
  map_sliding_en: false
  half_map_size: 100 # 影响计算负载，当前实时参与匹配的地图
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: true

publish:
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "UVC_MID360"
  pose_output_en: false

pcd_save:
  pcd_save_en: true
  # Export undistorted camera frames without blocking the SLAM thread. A
  # bounded queue prevents disk/PNG stalls from creating realtime backlog.
  colmap_output_en: true
  colmap_async_queue_size: 16
  colmap_png_compression: 1
  colmap_save_stride: 1 # 10秒一张图像，sx=10/stride 2=10/5s perframe
  filter_size_pcd: 0.05 # 参数调大点云稀疏，地图存储量
  interval: 200
