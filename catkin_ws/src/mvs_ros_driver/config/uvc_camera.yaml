%YAML:1.0
#--------------------------------------------------------------------------------------------
# UVC Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
DeviceName: "/dev/video0"
TopicName: "uvc_camera/image"

TriggerEnable: 1 # 0 stands for Off, 1 stands for On

# Every STREAMON keeps the offline-fitted scale a fixed, estimates only one
# session b from a bounded startup window, validates it, then freezes it.
TimestampSource: "pts_mid360_session_anchor"
Stm32TriggerPath: "/home/nuc/stm32_trigger_time"
ClockOffsetPath: "/home/nuc/mid360_clock_offset"
LidarTimeSharePath: "/home/nuc/timeshare"
# Per-frame raw V4L2 timing evidence for reproducible offline version4/version5
# comparisons. This topic is diagnostic only; it does not affect image stamps.
V4l2TimingTopic: "/uvc_camera/v4l2_timing"
PtsMetadataEnable: 1
PtsMetadataDevice: "/dev/video1"
PtsClockHz: 48000000.
PtsMatchMaxDeltaUs: 20000
# Offline-fitted and fixed across all sessions. Runtime never updates a.
CameraClockScale: 1.0000834459970804
# Deliberately zero: an absolute b from an earlier STREAMON is never reused.
CameraClockOffsetNs: "0"
CameraClockCalibrationValid: 1
SessionAnchorWarmupMs: 500
SessionAnchorCollectMs: 10000
# At the measured ~10 Hz camera rate, require most of the 10 s window to be
# present so a USB/metadata dropout cannot produce a premature lock.
SessionAnchorMinPairs: 80
SessionAnchorMaxAbsMeanMs: 1.0
SessionAnchorMaxP95Ms: 3.0
# The fixed scale a comes from the long calibration.  Over a 10 s startup
# window, the ~1.2 ms per-frame observation jitter makes the old 0.01 ms/s
# slope gate too sensitive; 17 recorded runs all stayed below 0.05 ms/s.
SessionAnchorMaxAbsDriftMsPerS: 0.05
# Five consecutive unmatched PTS frames trigger unwrap reset + full re-anchor.
SessionAnchorPtsResetMissingFrames: 5
# This round deliberately freezes both post-map offsets at zero.
ExposureCenterOffsetNs: "0"
CameraCalibrationOffsetNs: "0"
Stm32TriggerPeriodUs: 100000
# The measured comparison favored zero phase. Keep this adjustable for future
# STRB/oscilloscope verification.
Stm32TriggerPhaseUs: 0
# MID360 reported local_time - STM32/PPS source time averaged -103.770 us.
# Apply delta_pps = STM32_PPS - MID360_integer_second in nanoseconds.
Stm32PpsMinusMid360IntegerNs: -103770
Stm32SequenceResetThreshold: 100
Stm32TriggerToExposureCenterUs: 4760
# V4L2 SOE is exposure start; 6 ms exposure uses its 3 ms center.
V4l2SoeToExposureCenterUs: 3000
# Static residual calibration offset after exposure-center compensation.
CameraCalibrationOffsetUs: 0
image_scale: 1 # 1 0.5

Width: 1920
Height: 1080
PixelFormat: "MJPG"
FrameRate: 10

# UVC specific parameters
Backlight: 2 # Set to 2 for hardware trigger

# Exposure settings
ExposureAutoMode: 0 # Manual: keep every frame's exposure duration deterministic
Exposure: 156 # Camera manual exposure mode 1: 6 ms
ExposureTimeLower: 100 # Informational only; not applied by this UVC driver
ExposureTimeUpper: 10000 # Informational only; not applied by this UVC driver

Gain: 120 # Original sensor gain
GainAuto: 0

# Original UVC image controls.
Brightness: 0
Contrast: 0
Saturation: 56
Gamma: 100
WhiteBalanceAuto: 1
