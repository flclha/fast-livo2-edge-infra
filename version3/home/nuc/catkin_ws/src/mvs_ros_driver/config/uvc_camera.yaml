%YAML:1.0
#--------------------------------------------------------------------------------------------
# UVC Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
DeviceName: "/dev/video0"
TopicName: "uvc_camera/image"

TriggerEnable: 1 # 0 stands for Off, 1 stands for On

image_scale: 1 # 1 0.5

Width: 1920
Height: 1080
PixelFormat: "MJPG"
FrameRate: 10

# UVC specific parameters
Backlight: 2 # Set to 2 for hardware trigger

# Exposure settings
ExposureAutoMode: 1 # 0: Manual, 1: Auto (Aperture Priority), 2: Aperture 
Exposure: 5000 # Exposure value (used in manual mode)
ExposureTimeLower: 100 # Auto exposure time lower bound (us)
ExposureTimeUpper: 10000 # Auto exposure time upper bound (us)

Sharpness: 100 # Exposure time in manual mode
Gain: 15 # Sensor gain
